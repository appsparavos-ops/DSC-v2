<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constancia | DSC-v2"><style>body{font-family:system-ui;max-width:700px;margin:3rem auto;padding:1rem;color:#172554}label{display:block;margin-top:1rem;font-weight:700}input,select,button{box-sizing:border-box;width:100%;padding:.75rem;margin-top:.35rem;border:1px solid #cbd5e1;border-radius:.5rem}button{background:#1d4ed8;color:white;font-weight:700;cursor:pointer}.muted{color:#64748b}.result{padding:.75rem;border:1px solid #e2e8f0;margin-top:.4rem;cursor:pointer;border-radius:.4rem}.result:hover{background:#eff6ff}#status{min-height:1.5rem;margin-top:1rem}</style></head><body><h1>Constancia de pertenencia</h1><p class="muted">Busca tu nombre, selecciónalo e ingresa tu DNI. El sistema no muestra el DNI almacenado.</p><label>Temporada<select id="season"><option value="2026">2026</option></select></label><label>Nombre<input id="search" autocomplete="off" placeholder="Ej.: DIEGO LOPEZ"></label><div id="results"></div><label>DNI<input id="dni" inputmode="numeric" autocomplete="off"></label><button id="generate" disabled>Generar constancia</button><div id="status" role="status"></div><script src="carta.js"></script></body></html>
